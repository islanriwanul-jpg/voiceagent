name: Build Voice Agent v2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/voiceagent
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoiceAgent"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.voiceagent"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.voiceagent"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgentService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice Agent</string>
              <string name="desc">AI ভয়েস এজেন্ট আপনার কথামতো ফোনের স্ক্রিন পড়বে ও ট্যাপ, টাইপ, স্ক্রল করবে।</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/desc" />
          EOF

          cat > app/src/main/java/com/example/voiceagent/AgentService.kt << 'EOF'
          package com.example.voiceagent

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs

          class AgentService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: AgentService? = null

                  @Volatile
                  var logSink: ((String) -> Unit)? = null

                  val logText = StringBuilder()
              }

              private val ui = Handler(Looper.getMainLooper())
              private val wm by lazy { getSystemService(WINDOW_SERVICE) as WindowManager }
              private var tts: TextToSpeech? = null
              private var recognizer: SpeechRecognizer? = null
              private var bubble: TextView? = null
              private var bubbleBg: GradientDrawable? = null
              private var caption: TextView? = null
              @Volatile
              private var busy = false
              private val history = ArrayList<String>()
              private val nodes = ArrayList<AccessibilityNodeInfo>()
              private val hideCaptionRunnable = Runnable { removeCaptionNow() }

              override fun onServiceConnected() {
                  instance = this
                  tts = TextToSpeech(this) { s ->
                      if (s == TextToSpeech.SUCCESS) tts?.setLanguage(Locale("bn", "BD"))
                  }
                  showBubble()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  ui.post {
                      removeCaptionNow()
                      bubble?.let { try { wm.removeView(it) } catch (ex: Exception) {} }
                      bubble = null
                      recognizer?.destroy()
                  }
                  tts?.shutdown()
                  return super.onUnbind(intent)
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              // ---------- log / speak ----------

              fun log(s: String) {
                  synchronized(logText) { logText.append(s).append("\n\n") }
                  logSink?.invoke(s)
              }

              fun say(text: String) {
                  log("🤖 " + text)
                  showCaption("🤖 " + text)
                  tts?.speak(text, TextToSpeech.QUEUE_ADD, null, "agent")
              }

              // ---------- floating bubble ----------

              fun showBubble() {
                  ui.post {
                      if (bubble != null) return@post
                      val tv = TextView(this)
                      tv.text = "🎙"
                      tv.textSize = 24f
                      tv.gravity = Gravity.CENTER
                      tv.setTextColor(Color.WHITE)
                      val bg = GradientDrawable()
                      bg.shape = GradientDrawable.OVAL
                      bg.setColor(Color.parseColor("#1A73E8"))
                      tv.background = bg
                      val size = dp(56)
                      val lp = WindowManager.LayoutParams(
                          size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.TOP or Gravity.START
                      lp.x = dp(8)
                      lp.y = dp(200)
                      var sx = 0
                      var sy = 0
                      var tx = 0f
                      var ty = 0f
                      var moved = false
                      tv.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = lp.x; sy = lp.y; tx = ev.rawX; ty = ev.rawY; moved = false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (ev.rawX - tx).toInt()
                                  val dy = (ev.rawY - ty).toInt()
                                  if (abs(dx) > 10 || abs(dy) > 10) moved = true
                                  if (moved) {
                                      lp.x = sx + dx
                                      lp.y = sy + dy
                                      try { wm.updateViewLayout(tv, lp) } catch (ex: Exception) {}
                                  }
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) onBubbleTap()
                              }
                          }
                          true
                      }
                      wm.addView(tv, lp)
                      bubble = tv
                      bubbleBg = bg
                  }
              }

              private fun setState(icon: String, color: String) {
                  ui.post {
                      bubble?.text = icon
                      bubbleBg?.setColor(Color.parseColor(color))
                      bubble?.invalidate()
                  }
              }

              private fun onBubbleTap() {
                  if (busy) {
                      Agent.cancelled = true
                      tts?.stop()
                      say("থামছি।")
                      return
                  }
                  tts?.stop()
                  startListening()
              }

              // ---------- caption (small text near bottom) ----------

              private fun showCaption(t: String) {
                  ui.post {
                      ui.removeCallbacks(hideCaptionRunnable)
                      var tv = caption
                      if (tv == null) {
                          tv = TextView(this)
                          tv.textSize = 16f
                          tv.setTextColor(Color.WHITE)
                          tv.setBackgroundColor(Color.parseColor("#EE222222"))
                          tv.setPadding(dp(16), dp(12), dp(16), dp(12))
                          tv.maxLines = 12
                          tv.setOnClickListener { removeCaptionNow() }
                          val lp = WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                              PixelFormat.TRANSLUCENT
                          )
                          lp.gravity = Gravity.BOTTOM
                          lp.y = dp(70)
                          wm.addView(tv, lp)
                          caption = tv
                      }
                      tv.text = t
                      val delay = (4000L + t.length * 60L).coerceAtMost(25000L)
                      ui.postDelayed(hideCaptionRunnable, delay)
                  }
              }

              private fun removeCaptionNow() {
                  caption?.let { try { wm.removeView(it) } catch (ex: Exception) {} }
                  caption = null
              }

              private fun hideCaption() {
                  ui.post {
                      ui.removeCallbacks(hideCaptionRunnable)
                      removeCaptionNow()
                  }
              }

              // ---------- listening ----------

              private fun startListening() {
                  ui.post {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          showCaption("মাইক্রোফোনের অনুমতি দিতে Voice Agent অ্যাপ খুলুন।")
                          val i = Intent(this, MainActivity::class.java)
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                          return@post
                      }
                      if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                          showCaption("এই ফোনে স্পিচ রিকগনিশন নেই।")
                          return@post
                      }
                      recognizer?.destroy()
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      recognizer = r
                      r.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {
                              setState("👂", "#D93025")
                              showCaption("শুনছি...")
                          }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() { setState("…", "#F9A825") }
                          override fun onError(error: Int) {
                              setState("🎙", "#1A73E8")
                              if (error == 7 || error == 6) {
                                  showCaption("কিছু শুনতে পাইনি। আবার ট্যাপ করুন।")
                              } else {
                                  showCaption("শুনতে সমস্যা হয়েছে (কোড " + error + ")")
                              }
                          }
                          override fun onPartialResults(partialResults: Bundle?) {
                              val t = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              if (!t.isNullOrEmpty()) showCaption("🗣 " + t)
                          }
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                          override fun onResults(results: Bundle?) {
                              val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              setState("🎙", "#1A73E8")
                              if (t.isNullOrBlank()) {
                                  showCaption("বুঝতে পারিনি, আবার বলুন।")
                              } else {
                                  hideCaption()
                                  handleCommand(t)
                              }
                          }
                      })
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      r.startListening(i)
                  }
              }

              // ---------- run a command ----------

              fun handleCommand(text: String) {
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  val key = prefs.getString("key", "") ?: ""
                  val savedModel = prefs.getString("model", "") ?: ""
                  val model = if (savedModel.isBlank()) "gemini-3.8-flash" else savedModel
                  if (key.isEmpty()) {
                      say("আগে অ্যাপে গিয়ে Gemini API Key দিন।")
                      return
                  }
                  if (busy) return
                  busy = true
                  setState("⚙", "#F9A825")
                  log("🗣 " + text)
                  val hist = synchronized(history) { history.toList() }
                  Thread {
                      var ans = ""
                      try {
                          ans = Agent(key, model, hist, { log(it) }, { say(it) }).run(text)
                      } catch (ex: Exception) {
                          say("সমস্যা হয়েছে: " + ex.message)
                      }
                      synchronized(history) {
                          history.add("User: " + text + "\nAssistant: " + ans)
                          while (history.size > 8) history.removeAt(0)
                      }
                      busy = false
                      setState("🎙", "#1A73E8")
                  }.start()
              }

              // ---------- reading the screen ----------

              fun readScreen(): String {
                  nodes.clear()
                  val root = rootInActiveWindow ?: return "(screen not readable)"
                  val sb = StringBuilder()
                  sb.append("current app: ").append(root.packageName).append("\n")
                  walk(root, sb)
                  return sb.toString().take(7000)
              }

              private fun walk(n: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (n == null || nodes.size > 150) return
                  val text = (n.text?.toString() ?: n.contentDescription?.toString() ?: "").trim()
                  val interesting = text.isNotEmpty() || n.isClickable || n.isEditable
                  if (n.isVisibleToUser && interesting) {
                      nodes.add(n)
                      sb.append("[").append(nodes.size - 1).append("] ")
                      if (n.isEditable) sb.append("(input) ")
                      if (n.isClickable) sb.append("(button) ")
                      sb.append(text.take(80)).append("\n")
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), sb)
              }

              // ---------- phone actions ----------

              fun installedApps(): List<String> {
                  val pm = packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  return pm.queryIntentActivities(i, 0)
                      .map { it.loadLabel(pm).toString() }
                      .distinct().sorted().take(120)
              }

              fun openApp(name: String): Boolean {
                  val q = name.lowercase().trim()
                  if (q.isEmpty()) return false
                  val pm = packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(i, 0)
                  val m = list.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: list.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return false
                  val launch = pm.getLaunchIntentForPackage(m.activityInfo.packageName) ?: return false
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(launch)
                  return true
              }

              fun clickIndex(i: Int): Boolean {
                  val n = nodes.getOrNull(i) ?: return false
                  var c: AccessibilityNodeInfo? = n
                  while (c != null && !c.isClickable) c = c.parent
                  if (c != null && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val p = Path()
                  p.moveTo(r.centerX().toFloat(), r.centerY().toFloat())
                  return gesture(p, 60)
              }

              fun typeText(text: String, idx: Int): Boolean {
                  val target = nodes.getOrNull(idx)?.takeIf { it.isEditable }
                      ?: rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      ?: nodes.firstOrNull { it.isEditable }
                      ?: return false
                  target.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)
              }

              fun pressEnter(): Boolean {
                  val t = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return false
                  return if (Build.VERSION.SDK_INT >= 30) {
                      t.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                  } else false
              }

              fun scroll(down: Boolean): Boolean {
                  val dm = resources.displayMetrics
                  val x = dm.widthPixels / 2f
                  val a = dm.heightPixels * 0.75f
                  val b = dm.heightPixels * 0.30f
                  val p = Path()
                  if (down) {
                      p.moveTo(x, a); p.lineTo(x, b)
                  } else {
                      p.moveTo(x, b); p.lineTo(x, a)
                  }
                  return gesture(p, 400)
              }

              fun global(action: String): Boolean {
                  val a = when (action) {
                      "back" -> GLOBAL_ACTION_BACK
                      "home" -> GLOBAL_ACTION_HOME
                      else -> GLOBAL_ACTION_RECENTS
                  }
                  return performGlobalAction(a)
              }

              private fun gesture(path: Path, duration: Long): Boolean {
                  val latch = CountDownLatch(1)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, duration))
                      .build()
                  val ok = dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(d: GestureDescription?) { latch.countDown() }
                      override fun onCancelled(d: GestureDescription?) { latch.countDown() }
                  }, null)
                  if (ok) latch.await(3, TimeUnit.SECONDS)
                  return ok
              }

              // ---------- permission box ----------

              fun askConfirm(msg: String): Boolean {
                  hideCaption()
                  val latch = CountDownLatch(1)
                  var answer = false
                  var view: View? = null
                  val c = this
                  Handler(Looper.getMainLooper()).post {
                      val tv = TextView(c)
                      tv.text = msg
                      tv.textSize = 18f
                      tv.setTextColor(Color.WHITE)
                      tv.setPadding(40, 40, 40, 20)
                      val yes = Button(c)
                      yes.text = "হ্যাঁ"
                      val no = Button(c)
                      no.text = "না"
                      val row = LinearLayout(c)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.addView(yes, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(no, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      val box = LinearLayout(c)
                      box.orientation = LinearLayout.VERTICAL
                      box.setBackgroundColor(Color.parseColor("#EE222222"))
                      box.addView(tv)
                      box.addView(row)
                      view = box
                      yes.setOnClickListener {
                          answer = true
                          try { wm.removeView(box) } catch (ex: Exception) {}
                          latch.countDown()
                      }
                      no.setOnClickListener {
                          answer = false
                          try { wm.removeView(box) } catch (ex: Exception) {}
                          latch.countDown()
                      }
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.BOTTOM
                      wm.addView(box, lp)
                  }
                  val done = latch.await(60, TimeUnit.SECONDS)
                  if (!done) {
                      Handler(Looper.getMainLooper()).post {
                          try { view?.let { wm.removeView(it) } } catch (ex: Exception) {}
                      }
                      return false
                  }
                  return answer
              }
          }
          EOF

          cat > app/src/main/java/com/example/voiceagent/Agent.kt << 'EOF'
          package com.example.voiceagent

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class Agent(
              private val apiKey: String,
              private val model: String,
              private val history: List<String>,
              private val log: (String) -> Unit,
              private val say: (String) -> Unit
          ) {
              companion object {
                  @Volatile
                  var cancelled = false

                  val SYSTEM = """You are a friendly, smart voice assistant living on the user's Android phone. You can chat (answer questions, explain things, give advice, help with ideas, writing, translation, maths) and you can also control the phone.
          The user speaks Bengali by default. Reply in the language the user uses. The user's message comes from speech recognition and may contain mistakes, so work out what they most likely meant.
          Each turn you get the recent conversation, the user's message, the list of installed apps and the current screen as a numbered list. Items marked (button) are clickable, items marked (input) are text fields.
          Reply with ONLY one JSON object with these fields:
          action: one of open_app, click, type, enter, scroll, back, home, recents, wait, done
          app: app name (for open_app, exactly as written in the installed apps list)
          index: screen item number (for click, and optionally for type)
          text: text to type (for type)
          direction: down or up (for scroll)
          say: the message for the user
          confirm: true if you need the user's permission before doing this action
          Rules:
          - If the user is only chatting or asking for information, do NOT touch the phone. Answer at once with action done and write the full helpful answer in say. Sound natural and spoken, a few sentences unless the user wants more. Do not use markdown symbols, lists or emojis, because the answer is read aloud.
          - You have no live internet access. If asked for real-time facts such as news, prices or weather, say honestly that you cannot check them.
          - If the user wants something done on the phone, do one small step at a time. After each action you will receive the new screen. While working, keep say very short or empty.
          - Before any action that sends a message or email, posts something, pays, deletes, makes a call or installs, set confirm to true and ask the question in say.
          - Do not use confirm for harmless actions such as opening apps, scrolling or typing.
          - When the task is finished, use action done and say what you did in one short sentence.
          - If you cannot do the task or are unsure what to tap, use action done and tell the user instead of guessing.
          - Never type passwords or payment details.
          """
              }

              fun run(command: String): String {
                  cancelled = false
                  val svc = AgentService.instance
                  if (svc == null) {
                      say("আগে সেটিংস থেকে অ্যাক্সেসিবিলিটি সার্ভিস চালু করুন।")
                      return ""
                  }
                  val contents = JSONArray()
                  fun add(role: String, text: String) {
                      contents.put(
                          JSONObject().put("role", role)
                              .put("parts", JSONArray().put(JSONObject().put("text", text)))
                      )
                  }
                  val hist = if (history.isEmpty()) "(none)" else history.joinToString("\n")
                  add(
                      "user",
                      "Recent conversation:\n" + hist + "\n\nUser message: " + command +
                          "\n\nInstalled apps: " + svc.installedApps().joinToString(", ") +
                          "\nCurrent screen:\n" + svc.readScreen()
                  )
                  for (step in 1..15) {
                      if (cancelled) return ""
                      val reply = try {
                          callGemini(contents)
                      } catch (e: Exception) {
                          say("সমস্যা হয়েছে: " + e.message)
                          return ""
                      }
                      add("model", reply)
                      val j = try {
                          JSONObject(reply)
                      } catch (e: Exception) {
                          say("উত্তর বুঝতে পারিনি।")
                          return ""
                      }
                      val action = j.optString("action")
                      val msg = j.optString("say", "")
                      if (j.optBoolean("confirm", false)) {
                          val q = if (msg.isEmpty()) "এটা করব?" else msg
                          say(q)
                          val ok = svc.askConfirm(q)
                          if (!ok) {
                              say("ঠিক আছে, বাতিল করলাম।")
                              return "(user declined)"
                          }
                      } else if (msg.isNotEmpty() && action != "done") {
                          log("• " + msg)
                      }
                      var result: String
                      when (action) {
                          "open_app" -> {
                              val app = j.optString("app")
                              result = if (svc.openApp(app)) "opened " + app else "app not found: " + app
                          }
                          "click" -> result = if (svc.clickIndex(j.optInt("index", -1))) "clicked" else "click failed"
                          "type" -> result = if (svc.typeText(j.optString("text"), j.optInt("index", -1))) "typed" else "no input field found"
                          "enter" -> result = if (svc.pressEnter()) "enter pressed" else "enter failed"
                          "scroll" -> result = if (svc.scroll(j.optString("direction") != "up")) "scrolled" else "scroll failed"
                          "back", "home", "recents" -> result = if (svc.global(action)) "done" else "failed"
                          "wait" -> result = "waited"
                          "done" -> {
                              val finalMsg = if (msg.isEmpty()) "কাজ শেষ।" else msg
                              say(finalMsg)
                              return finalMsg
                          }
                          else -> result = "unknown action"
                      }
                      Thread.sleep(1500)
                      add("user", "Result: " + result + "\nCurrent screen:\n" + svc.readScreen())
                  }
                  say("অনেক ধাপ হয়ে গেছে, তাই থামলাম।")
                  return ""
              }

              private fun callGemini(contents: JSONArray): String {
                  val body = JSONObject()
                      .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", SYSTEM))))
                      .put("contents", contents)
                      .put("generationConfig", JSONObject().put("responseMimeType", "application/json"))
                  val url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent"
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000
                  c.readTimeout = 90000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("x-goog-api-key", apiKey)
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val text = stream.bufferedReader().use { it.readText() }
                  if (code !in 200..299) throw Exception("HTTP " + code + ": " + text.take(300))
                  val t = JSONObject(text).getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                  return t.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
              }
          }
          EOF

          cat > app/src/main/java/com/example/voiceagent/MainActivity.kt << 'EOF'
          package com.example.voiceagent

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var logView: TextView
              private lateinit var keyBox: EditText
              private lateinit var modelBox: EditText
              private lateinit var cmdBox: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                  }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(40, 80, 40, 40)

                  val title = TextView(this)
                  title.text = "Voice Agent"
                  title.textSize = 24f
                  root.addView(title)

                  val help = TextView(this)
                  help.text = "অ্যাক্সেসিবিলিটি সার্ভিস চালু করলে স্ক্রিনে 🎙 বাবল আসবে। যেকোনো অ্যাপে থেকে বাবলে ট্যাপ করে কথা বলুন। বাবল টেনে সরানো যায়।"
                  help.textSize = 14f
                  help.setPadding(0, 10, 0, 20)
                  root.addView(help)

                  keyBox = EditText(this)
                  keyBox.hint = "Gemini API Key"
                  keyBox.setSingleLine(true)
                  keyBox.setText(prefs.getString("key", ""))
                  root.addView(keyBox)

                  modelBox = EditText(this)
                  modelBox.hint = "মডেলের নাম"
                  modelBox.setSingleLine(true)
                  val savedModel = prefs.getString("model", "") ?: ""
                  modelBox.setText(if (savedModel.isBlank()) "gemini-3.8-flash" else savedModel)
                  root.addView(modelBox)

                  fun btn(label: String, onClick: () -> Unit) {
                      val b = Button(this)
                      b.text = label
                      b.setOnClickListener { onClick() }
                      root.addView(b)
                  }

                  fun save() {
                      prefs.edit()
                          .putString("key", keyBox.text.toString().trim())
                          .putString("model", modelBox.text.toString().trim())
                          .apply()
                  }

                  btn("সেভ করুন") {
                      save()
                      logView.append("সেভ হয়েছে।\n\n")
                  }
                  btn("অ্যাক্সেসিবিলিটি সেটিংস খুলুন") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  btn("🎙 বাবল আবার দেখান") {
                      val s = AgentService.instance
                      if (s == null) {
                          logView.append("আগে অ্যাক্সেসিবিলিটি সার্ভিস চালু করুন।\n\n")
                      } else {
                          s.showBubble()
                      }
                  }

                  cmdBox = EditText(this)
                  cmdBox.hint = "এখানে লিখেও কথা বলতে পারেন"
                  root.addView(cmdBox)

                  btn("পাঠান") {
                      save()
                      val t = cmdBox.text.toString().trim()
                      val s = AgentService.instance
                      if (t.isNotEmpty()) {
                          if (s == null) {
                              logView.append("আগে অ্যাক্সেসিবিলিটি সার্ভিস চালু করুন।\n\n")
                          } else {
                              cmdBox.setText("")
                              s.handleCommand(t)
                          }
                      }
                  }
                  btn("⛔ থামুন") {
                      Agent.cancelled = true
                  }

                  logView = TextView(this)
                  logView.textSize = 16f
                  logView.setPadding(0, 30, 0, 0)
                  root.addView(logView)

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  synchronized(AgentService.logText) {
                      logView.text = AgentService.logText.toString()
                  }
                  AgentService.logSink = { s -> runOnUiThread { logView.append(s + "\n\n") } }
              }

              override fun onPause() {
                  super.onPause()
                  AgentService.logSink = null
              }
          }
